name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Uma execução por branch: pushes seguidos cancelam a verificação anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24: necessário para o runner de testes com glob e para a remoção
      # de tipos dos arquivos .ts usados pelos testes (*.test.mjs).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar (tsc + eslint + testes)
        run: npm run verify

      - name: Compilar para produção
        run: npm run build
